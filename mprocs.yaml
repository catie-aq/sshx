# prettier-ignore
procs:
  server:
    shell: >-
      cargo run --bin sshx-server --
      --override-origin https://homa-server2.gaur-toad.ts.net:5173
      --secret dev-secret
      --redis-url redis://localhost:12601
      --listen 0.0.0.0
  web:
    shell: npm run dev
    stop: SIGKILL  # TODO: Why is this necessary?
  client:
    shell: >-
      cargo run --bin sshx --
      --server http://homa-server2.gaur-toad.ts.net:8051
    autostart: false
