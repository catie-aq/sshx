# prettier-ignore
procs:
  server:
    shell: >-
      cargo run --bin sshx-server --
      --port 8052
      --override-origin https://homa-server2.burro-piranha.ts.net:3006
      --secret dev-secret
      --redis-url redis://localhost:12602
      --listen 0.0.0.0
      --host homa-server2.burro-piranha.ts.net
  web:
    shell: SSHX_SERVER_PORT=8052 SSHX_WEB_PORT=3006 npm run dev
    stop: SIGKILL  # TODO: Why is this necessary?
  client:
    shell: >-
      cargo run --bin sshx --
      --server http://homa-server2.burro-piranha.ts.net:8052
    autostart: false


 