# Services used by sshx for development.
#
# Usage:
#   docker compose up -d          # Start all services in background
#   docker compose up             # Start with logs visible
#   docker compose logs -f web    # Follow logs for a specific service
#   docker compose down           # Stop all services

services:
  redis:
    image: redis:7.2
    container_name: sshx-redis
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - 127.0.0.1:12601:6379
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend-dev
    container_name: sshx-backend
    network_mode: host
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      - ./homa-server2.gaur-toad.ts.net.crt:/certs/server.crt:ro
      - ./homa-server2.gaur-toad.ts.net.key:/certs/server.key:ro
      - cargo-cache:/usr/local/cargo/registry
      - cargo-target:/app/target
    command: >
      cargo run --bin sshx-server --
      --override-origin https://homa-server2.gaur-toad.ts.net:5173
      --secret dev-secret
      --redis-url redis://localhost:12601
      --listen 0.0.0.0
      --host homa-server2.gaur-toad.ts.net
    depends_on:
      - redis
    restart: unless-stopped

  web:
    image: node:18
    container_name: sshx-web
    network_mode: host
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      - ./homa-server2.gaur-toad.ts.net.crt:/certs/server.crt:ro
      - ./homa-server2.gaur-toad.ts.net.key:/certs/server.key:ro
      - node-modules:/app/node_modules
    environment:
      - HOME=/tmp
    command: sh -c "git config --global --add safe.directory /app && npm install && npm run dev"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cargo-cache:
    name: sshx-cargo-cache
  cargo-target:
    name: sshx-cargo-target
  node-modules:
    name: sshx-node-modules
