# Services used by sshx for development.
#
# Usage:
#   docker compose up -d          # Start all services in background
#   docker compose up             # Start with logs visible
#   docker compose logs -f web    # Follow logs for a specific service
#   docker compose down           # Stop all services

services:
  redis:
    image: redis:7.2
    container_name: sshx-redis
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - 127.0.0.1:12601:6379
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend-dev
    container_name: sshx-backend
    network_mode: host
    working_dir: /app
    environment:
      - LOCAL_UID=${UID:-1000}
      - LOCAL_GID=${GID:-1000}
      - FIX_DIRS=/usr/local/cargo/registry:/app/target
    volumes:
      - .:/app
      - ./${SSHX_HOST}.crt:/certs/server.crt:ro
      - ./${SSHX_HOST}.key:/certs/server.key:ro
      - cargo-cache:/usr/local/cargo/registry
      - cargo-target:/app/target

    command: >
      cargo run --bin sshx-server --
      --override-origin https://${SSHX_HOST}:${SSHX_WEB_PORT}
      --secret ${SSHX_SECRET}
      --admin-token ${SSHX_ADMIN_TOKEN:-dev-admin-token}
      --redis-url redis://localhost:${SSHX_REDIS_PORT}
      --listen 0.0.0.0
      --host ${SSHX_HOST}
    depends_on:
      - redis
    restart: unless-stopped

  web:
    image: node:20
    container_name: sshx-web
    network_mode: host
    working_dir: /app
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    environment:
      - SSHX_HOST=${SSHX_HOST}
      - SSHX_WEB_PORT=${SSHX_WEB_PORT}
      - SSHX_WEB_HOST=${SSHX_WEB_HOST}
      - SSHX_SERVER_PORT=${SSHX_SERVER_PORT}
      - TLS_CERT=${TLS_CERT}
      - TLS_KEY=${TLS_KEY}
      - HOME=/tmp
    command: sh -c "git config --global --add safe.directory /app && npm install && npm run dev"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cargo-cache:
    name: sshx-cargo-cache
  cargo-target:
    name: sshx-cargo-target
  node-modules:
    name: sshx-node-modules
